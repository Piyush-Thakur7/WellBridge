<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded Background Container -->
  <rect width="1200" height="300" rx="36" fill="#F8FAFC"/>
  
  <!-- Logo Icon Container (Square Rounded) -->
  <g transform="translate(60, 45)">
    <rect width="210" height="210" rx="52" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="4"/>
    <g transform="translate(5, 5) scale(0.39)">
      <!-- Bridge Arch -->
      <path d="M64 405 C149 235, 363 235, 448 405" stroke="#0D9488" stroke-width="36" stroke-linecap="round" fill="none"/>
      <!-- Bridge Lower Support Arc -->
      <path d="M107 427 C181 320, 331 320, 405 427" stroke="#0D9488" stroke-width="20" stroke-linecap="round" stroke-opacity="0.4" fill="none"/>
      <!-- ECG Heartbeat Pulse Line -->
      <path d="M128 256 L202 256 L234 149 L266 341 L298 224 L330 277 L384 277" stroke="#0D9488" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Glow center pulse dot -->
      <circle cx="266" cy="341" r="20" fill="#0D9488"/>
    </g>
  </g>

  <!-- Typography: Brand Name -->
  <text x="310" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#0F172A" letter-spacing="-1.5">
    WellBridge <tspan fill="#0D9488">AI</tspan>
  </text>

  <!-- Typography: Subtitle / Tagline -->
  <text x="315" y="205" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#64748B" font-style="italic">
    Bridging Confusing Medical Reports to Everyday Life
  </text>
</svg>
